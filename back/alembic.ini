# Alembic configuration file for Plataforma de Comercio

[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is expected, default: "utc"
# can be overridden on a per-migration basis
# with the --timezone option

timezone = utc

# the template used to generate migration files
# The default value is %%(rev)s_%%(slug)s
# can be overridden on a per-migration basis
# with the --slug-template option
slug_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision environment defaults to true
run_environment = true

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location
# version_locations =

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = %%(DATABASE_URL)s

# the version table name to be used in the target database
# version_table = alembic_version

# if true, the version table name will be rendered as
# %version_table%%revision% e.g. : %version_table%_abc123
# version_table_name_format = %(version_table)s_%%(rev)s

# When using multiple "schema" contexts, this can be
# set to a list of schema names which will be rendered
# into the version table's name for each schema separately
# version_table_schema =

# the naming style used to generate the version table name
# version_table_name_format = %(table_name)s

# when using multiple "schema" contexts, this can be
# set to a list of schema names which will be rendered
# into the version table's name for each schema separately
# version_table_schema =

# @logging: configuration for the Python logging system.
# formatters, handlers, and loggers are defined in sections
# [loggers], [handlers], [formatters] below.
# [loggers]
# keys = root,sqlalchemy,alembic
#
# [handlers]
# keys = console
#
# [formatters]
# keys = generic
#
# [logger_root]
# level = WARN
# handlers = console
# qualname =
#
# [logger_sqlalchemy]
# level = WARN
# handlers =
# qualname = sqlalchemy.engine
#
# [logger_alembic]
# level = INFO
# handlers =
# qualname = alembic
#
# [handler_console]
# class = StreamHandler
# args = (sys.stderr,)
# level = NOTSET
# formatter = generic
#
# [formatter_generic]
# format = %(levelname)-5.5s [%(name)s] %(message)s
# datefmt = %H:%M:%S
#
# class = logging.StreamHandler
# args = (sys.stderr,)
# level = NOTSET
# formatter = generic

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# See the documentation for further detail and examples

# format using "black" - use this if you have black installed
# hooks = black
# black.type = console_application
# black.executable = black
# black.options = "-l 100" REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
